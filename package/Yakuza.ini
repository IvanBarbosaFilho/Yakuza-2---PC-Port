# Yakuza (PS2, USA) - PC port settings. Read by Yakuza.exe at start.
# The game is not included: on the first start you pick your own disc image (SLUS-21348, .iso); its path is saved
# below. Delete the iso= line to pick another one.
serial=SLUS_213.48
title=Yakuza
iso=
# Optional fan patch offered on the first start (ps2_launcher.cpp; later: start with --patch <file>). Applied to a copy
# of the disc image (iso_patched=, written then), which becomes the default (patch_setting); the options menu's
# "Voices" switches back to the original on the next start.
patch_name=Yakuza Restored 1.0
patch_about=A fan patch: the original Japanese voices, re-translated subtitles and a revised script.
patch_md5_in=251059e4d54fb61369e1139b5d4d5e6c
patch_md5_out=12678adfb73730ec081aa6a5db73c6a6
patch_member=Yakuza (USA) (Restored 1.0).xdelta
patch_image=Yakuza (USA) (Restored 1.0).iso
patch_setting=voices=Japanese

[env]
# Defaults of the runtime (a variable already set in the environment wins). In-game options: F2 or L3.
PS2X_GS=pcsx2
PS2X_PCSX2_OPTIONS=blending=4;align_sprite=1;native_scaling=2
PS2X_FPS_MENU=1
PS2X_MEMORY_PATCHES=config/memory_patches.txt
PS2X_MOD_SETTINGS=config/mods.ini
PS2X_MTVU=1
PS2X_IOP_THREAD=1
PS2X_VU_DENORMALS=1
